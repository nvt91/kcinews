name: KCI News Video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "validate is no-Vbee; preview/video may synthesize missing narration; no automatic final"
        type: choice
        required: true
        default: validate
        options:
          - validate
          - preview
          - voice-test
          - video
      job:
        description: "Reviewed schema-v2 JSON with an editing plan inside jobs/"
        type: string
        required: true
        default: jobs/kci-schema-v2-example.json
  pull_request:
    paths:
      - 'src/**'
      - '.agents/skills/kci-news-video/**'
      - 'api/**'
      - 'workers/**'
      - 'wrangler.toml'
      - 'scripts/**'
      - 'jobs/**'
      - 'package.json'
      - '.github/workflows/kci-video.yml'
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: kci-render-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node scripts/test-kci-editorial.mjs
      - run: node scripts/validate-kci-job.mjs jobs/kci-schema-v2-example.json
      - run: node --check scripts/vbee.mjs
      - run: node --check scripts/run-job.mjs
      - run: node --check scripts/produce-voiced-preview.mjs
      - run: node scripts/test-aligned-preview.mjs
      - run: python scripts/test-aligned-preview.py
      - run: node scripts/test-vbee-adapter.mjs
      - run: node --check workers/vbee-callback.mjs
      - run: node scripts/test-vbee-callback.mjs
      - name: Cloudflare live endpoint check (advisory)
        continue-on-error: true
        run: node scripts/check-worker.mjs
      - run: node scripts/run-job.mjs --mode=validate
      - name: Test preserved legacy and data-driven layout fixtures, no synthesis
        run: |
          mkdir -p out
          npx remotion still src/index.ts KciNews out/kci-smoke.png --frame=25
          node scripts/create-daily-preview-props.mjs
          npx remotion still src/index.ts KciNewsDaily out/kci-daily-hook.png --props=out/kci-daily-preview-props.json --frame=55
          npx remotion still src/index.ts KciNewsDaily out/kci-daily-compare.png --props=out/kci-daily-preview-props.json --frame=355
          npx remotion still src/index.ts KciNewsDaily out/kci-daily-cta.png --props=out/kci-daily-preview-props.json --frame=1830
      - name: Upload layout evidence
        uses: actions/upload-artifact@v4
        with:
          name: kci-pr-render-${{ github.run_id }}
          path: |
            out/kci-smoke.png
            out/kci-daily-*.png
          retention-days: 7
          if-no-files-found: error
  render:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       (startsWith(github.event.issue.title, '[KCI VOICE TEST]') ||
        startsWith(github.event.issue.title, '[KCI VIDEO]')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      KCI_JOB: ${{ inputs.job }}
      KCI_MODE: ${{ inputs.mode }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID }}
      VBEE_API_TOKEN: ${{ secrets.VBEE_API_TOKEN }}
      VBEE_VOICE_CODE: n_hanoi_male_anhkhoitintuc_zero_shot_news_vc
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://kcinews.golffashion-vn.workers.dev/api/vbee-callback' }}
      VBEE_AUDIO_HOSTS: ${{ vars.VBEE_AUDIO_HOSTS || 'vbee-studio2-3.s3.ap-southeast-1.amazonaws.com' }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Validate the selected job without paid synthesis
        run: node scripts/run-job.mjs --mode=validate
      - name: Ensure FFmpeg and CPU-only word alignment
        timeout-minutes: 15
        run: |
          bash scripts/ensure-media-tools.sh
          bash scripts/install-alignment.sh
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kci-whisper-small-cpu-v1
      - name: Verify callback before a possible Vbee request
        run: node scripts/check-worker.mjs
      - name: Produce voiced preview or voice test; never auto-final
        run: node scripts/run-job.mjs
      - name: Preserve audio, pending requests and review evidence on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kci-${{ github.run_id }}
          path: |
            out/
            output/
            public/voice/*.mp3
            public/voice-cache/
            public/aligned/
            alignment-environment.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Record Actions run on requesting issue
        if: ${{ always() && github.event_name == 'issues' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KCI_ISSUE: ${{ github.event.issue.number }}
          KCI_REPO: ${{ github.repository }}
          KCI_RUN_ID: ${{ github.run_id }}
          KCI_RESULT: ${{ job.status }}
        run: |
          gh issue comment "$KCI_ISSUE" --repo "$KCI_REPO" \
            --body "KCI_ACTIONS_RUN:$KCI_RUN_ID | Result: $KCI_RESULT | https://github.com/$KCI_REPO/actions/runs/$KCI_RUN_ID — PREVIEW/VOICE TEST only; final requires approval; do not auto-publish."
