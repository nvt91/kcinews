name: KCI News Video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "validate or preview are no-Vbee runs; voice-test and video invoke paid Vbee requests"
        type: choice
        required: true
        default: validate
        options:
          - validate
          - preview
          - voice-test
          - video
      job:
        description: "Reviewed input JSON inside jobs/"
        type: string
        required: true
        default: jobs/kci-2026-10-23.json
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'jobs/**'
      - 'package.json'
      - '.github/workflows/kci-video.yml'

permissions:
  contents: read

concurrency:
  group: kci-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --check scripts/vbee.mjs
      - run: node --check scripts/run-job.mjs
      - run: node scripts/run-job.mjs --mode=validate
  render:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID }}
      VBEE_API_TOKEN: ${{ secrets.VBEE_API_TOKEN }}
      VBEE_VOICE_CODE: ${{ vars.VBEE_VOICE_CODE }}
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL }}
      VBEE_AUDIO_HOSTS: ${{ vars.VBEE_AUDIO_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate job
        run: node scripts/run-job.mjs --mode=validate --job="${{ inputs.job }}"
      - name: Produce preview, Vbee test, or MP4
        run: node scripts/run-job.mjs --mode="${{ inputs.mode }}" --job="${{ inputs.job }}"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kci-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 7
