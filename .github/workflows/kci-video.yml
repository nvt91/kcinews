name: KCI News Video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "validate or preview are no-Vbee runs; voice-test and video invoke paid Vbee requests"
        type: choice
        required: true
        default: validate
        options:
          - validate
          - preview
          - voice-test
          - video
      job:
        description: "Reviewed input JSON inside jobs/"
        type: string
        required: true
        default: jobs/kci-2026-10-23.json
  pull_request:
    paths:
      - 'src/**'
      - '.agents/skills/kci-news-video/**'
      - 'api/**'
      - 'workers/**'
      - 'wrangler.toml'
      - 'scripts/**'
      - 'jobs/**'
      - 'package.json'
      - '.github/workflows/kci-video.yml'
  issues:
    types: [opened, reopened]

permissions:
  contents: read

concurrency:
  group: kci-render-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node scripts/test-kci-editorial.mjs
      - run: node scripts/validate-kci-job.mjs jobs/kci-schema-v2-example.json
      - run: node --check scripts/vbee.mjs
      - run: node --check scripts/run-job.mjs
      - run: node scripts/test-vbee-adapter.mjs
      - run: node --check workers/vbee-callback.mjs
      - run: node scripts/test-vbee-callback.mjs
      - name: Cloudflare live endpoint check (advisory before first production deployment)
        continue-on-error: true
        run: node scripts/check-worker.mjs
      - run: node scripts/run-job.mjs --mode=validate
      - name: Notify script offline checks
        run: |
          node --check scripts/notify-render.mjs
          node scripts/test-notify-render.mjs
      - name: Test legacy KCI and data-driven daily story frames
        run: |
          mkdir -p out
          npx remotion still src/index.ts KciNews out/kci-smoke.png --frame=25
          node scripts/create-daily-preview-props.mjs
          npx remotion still src/index.ts KciNewsDaily out/kci-daily-hook.png --props=out/kci-daily-preview-props.json --frame=55
          npx remotion still src/index.ts KciNewsDaily out/kci-daily-compare.png --props=out/kci-daily-preview-props.json --frame=355
          npx remotion still src/index.ts KciNewsDaily out/kci-daily-cta.png --props=out/kci-daily-preview-props.json --frame=1830
      - name: Upload KCI rendering evidence
        uses: actions/upload-artifact@v4
        with:
          name: kci-pr-render-${{ github.run_id }}
          path: |
            out/kci-smoke.png
            out/kci-daily-*.png
          retention-days: 7
          if-no-files-found: error
  render:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       (startsWith(github.event.issue.title, '[KCI VOICE TEST]') ||
        startsWith(github.event.issue.title, '[KCI VIDEO]')))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      issues: write
    env:
      KCI_JOB: ${{ inputs.job }}
      KCI_MODE: ${{ inputs.mode }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID }}
      VBEE_API_TOKEN: ${{ secrets.VBEE_API_TOKEN }}
      VBEE_VOICE_CODE: n_hanoi_male_anhkhoitintuc_zero_shot_news_vc
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://kcinews.golffashion-vn.workers.dev/api/vbee-callback' }}
      VBEE_AUDIO_HOSTS: ${{ vars.VBEE_AUDIO_HOSTS || 'vbee-studio2-3.s3.ap-southeast-1.amazonaws.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Retry = close then reopen the issue. Never re-render (and re-pay Vbee for)
      # an issue that already produced an MP4.
      - name: Refuse reopen when this issue already has a rendered MP4
        if: github.event_name == 'issues' && github.event.action == 'reopened'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          mkdir -p out
          if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --jq '.[].body' | grep -q 'KCI_RENDER_READY:'; then
            echo "Issue đã có MP4 render thành công; mở issue mới nếu thật sự cần render lại." | tee out/failure-reason.txt
            echo "::error::Issue already has a rendered MP4; refusing a duplicate paid render."
            exit 1
          fi
      - name: Validate the selected job before paid Vbee synthesis
        run: |
          # Owner-created [KCI VIDEO] issues select a checked-in job. This preflight must
          # validate that exact job, not a legacy hard-coded demonstration story.
          if [[ "$GITHUB_EVENT_NAME" == "issues" ]]; then
            selected_job="$(node -e 'const fs=require("node:fs"); const e=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,"utf8")); const data=JSON.parse(e.issue?.body||"{}"); if(!/^jobs\/[a-z0-9-]+\.json$/.test(data.job||""))process.exit(2); process.stdout.write(data.job);')"
          else
            selected_job="$KCI_JOB"
          fi
          mkdir -p out
          # Keep the exact reason so the issue comment can say what to fix.
          if ! node scripts/run-job.mjs --mode=validate --job="$selected_job" 2> out/failure-reason.txt; then
            cat out/failure-reason.txt >&2
            exit 1
          fi
          rm -f out/failure-reason.txt
      - name: Install dependencies after successful editorial validation
        run: npm ci
      - name: Install FFmpeg and ffprobe after successful editorial validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffprobe
          command -v ffmpeg
      # Vbee synthesis is verified by its API response and authenticated polling in
      # scripts/vbee.mjs. The callback Worker is telemetry, not the output source.
      # Do not block an otherwise valid paid render solely on its health GET.
      - name: Check Cloudflare callback Worker (advisory; Vbee polling remains required)
        continue-on-error: true
        run: node scripts/check-worker.mjs
      # 17/11/2026 step 1: per-word caption timing measured on the real Vbee audio.
      # Optional and non-blocking: if this fails, run-job.mjs keeps proportional captions.
      - name: Cache Whisper model for word timing
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kci-whisper-small-v1
      - name: Install word-timing aligner (optional, CPU only, no torch)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python3 -m pip install --quiet --user 'faster-whisper==1.2.1' numpy
          python3 -c 'import faster_whisper; print("faster-whisper ready")'
      - name: Produce preview, Vbee test, or MP4
        run: node scripts/run-job.mjs
      - name: Preserve audio and review artifacts even if a later render step fails
        id: upload-review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kci-${{ github.run_id }}
          path: |
            out/
            public/voice/*.mp3
          if-no-files-found: warn
          retention-days: 7

      - name: Notify when render finishes (review only, no publish)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KCI_EVENT_NAME: ${{ github.event_name }}
          KCI_ISSUE: ${{ github.event.issue.number }}
          KCI_REPO: ${{ github.repository }}
          KCI_RUN_ID: ${{ github.run_id }}
          KCI_RUN_ATTEMPT: ${{ github.run_attempt }}
          KCI_RESULT: ${{ job.status }}
          KCI_SERVER_URL: ${{ github.server_url }}
          KCI_ARTIFACT_URL: ${{ steps.upload-review.outputs.artifact-url }}
          KCI_EDITION: ${{ github.event.issue.title || inputs.job }}
          KCI_JOB: ${{ inputs.job }}
          KCI_FAILURE_FILE: out/failure-reason.txt
        run: node scripts/notify-render.mjs
