name: KCI News Video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "validate or preview are no-Vbee; voice-test and video call Vbee; video-reuse renders from an existing artifact"
        type: choice
        required: true
        default: validate
        options:
          - validate
          - preview
          - voice-test
          - video
          - video-reuse
      job:
        description: "Reviewed input JSON inside jobs/"
        type: string
        required: true
        default: jobs/kci-2026-10-23.json
      voice_run_id:
        description: "video-reuse only: Actions run id whose artifact kci-<id> holds public/voice MP3s"
        type: string
        required: false
        default: ""
      regen_scenes:
        description: "video-reuse only: 1-based scene numbers to re-synthesize with Vbee, comma-separated. Empty calls no Vbee."
        type: string
        required: false
        default: ""
  pull_request:
    paths:
      - 'src/**'
      - '.agents/skills/kci-news-video/**'
      - 'api/**'
      - 'workers/**'
      - 'wrangler.toml'
      - 'scripts/**'
      - 'jobs/**'
      - 'package.json'
      - '.github/workflows/kci-video.yml'
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: kci-render-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node scripts/test-kci-editorial.mjs
      - run: node scripts/validate-kci-job.mjs jobs/kci-schema-v2-example.json
      - run: node --check scripts/vbee.mjs
      - run: node --check scripts/run-job.mjs
      - run: node --check scripts/align-captions.mjs
      - run: node scripts/test-align-captions.mjs
      - run: node scripts/test-video-reuse.mjs
      - run: node scripts/test-vbee-adapter.mjs
      - run: node --check workers/vbee-callback.mjs
      - run: node scripts/test-vbee-callback.mjs
      - name: Cloudflare live endpoint check (advisory before first production deployment)
        continue-on-error: true
        run: node scripts/check-worker.mjs
      - run: node scripts/run-job.mjs --mode=validate
      - name: Test legacy KCI and data-driven daily story frames
        run: |
          mkdir -p out
          npx remotion still src/index.ts KciNews out/kci-smoke.png --frame=25
          node scripts/create-daily-preview-props.mjs
          npx remotion still src/index.ts KciNewsDaily out/kci-daily-hook.png --props=out/kci-daily-preview-props.json --frame=55
          npx remotion still src/index.ts KciNewsDaily out/kci-daily-compare.png --props=out/kci-daily-preview-props.json --frame=355
          npx remotion still src/index.ts KciNewsDaily out/kci-daily-cta.png --props=out/kci-daily-preview-props.json --frame=1830
      - name: Upload KCI rendering evidence
        uses: actions/upload-artifact@v4
        with:
          name: kci-pr-render-${{ github.run_id }}
          path: |
            out/kci-smoke.png
            out/kci-daily-*.png
          retention-days: 7
          if-no-files-found: error
  render:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       (startsWith(github.event.issue.title, '[KCI VOICE TEST]') ||
        startsWith(github.event.issue.title, '[KCI VIDEO]')))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      KCI_JOB: ${{ inputs.job }}
      KCI_MODE: ${{ inputs.mode }}
      VBEE_APP_ID: ${{ secrets.VBEE_APP_ID }}
      VBEE_API_TOKEN: ${{ secrets.VBEE_API_TOKEN }}
      VBEE_VOICE_CODE: n_hanoi_male_anhkhoitintuc_zero_shot_news_vc
      VBEE_WEBHOOK_URL: ${{ vars.VBEE_WEBHOOK_URL || 'https://kcinews.golffashion-vn.workers.dev/api/vbee-callback' }}
      VBEE_AUDIO_HOSTS: ${{ vars.VBEE_AUDIO_HOSTS || 'vbee-studio2-3.s3.ap-southeast-1.amazonaws.com' }}
      # Unset repo variable defaults to 1 so this PR branch can align captions
      # without changing repository settings. Set KCI_ALIGN_CAPTIONS to 0 to
      # force the old 7-word cues. Revisit this default when merging.
      KCI_ALIGN_CAPTIONS: ${{ vars.KCI_ALIGN_CAPTIONS || '1' }}
      KCI_REGEN_SCENES: ${{ inputs.regen_scenes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install FFmpeg and ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffprobe
          command -v ffmpeg
      - name: Validate job
        run: node scripts/run-job.mjs --mode=validate --job=jobs/kci-2026-10-23.json
      - name: Verify Cloudflare Worker before any Vbee request
        if: inputs.mode != 'video-reuse'
        run: node scripts/check-worker.mjs
      - name: Require a prior voice artifact for video-reuse
        if: inputs.mode == 'video-reuse' && inputs.voice_run_id == ''
        run: echo "video-reuse requires voice_run_id" && exit 1
      - name: Download reused narration MP3s
        if: inputs.mode == 'video-reuse'
        uses: actions/download-artifact@v4
        with:
          name: kci-${{ inputs.voice_run_id }}
          run-id: ${{ inputs.voice_run_id }}
          github-token: ${{ github.token }}
          path: reused-voice
      - name: Place reused narration into public/voice
        if: inputs.mode == 'video-reuse'
        run: |
          set -euo pipefail
          mkdir -p public/voice
          find reused-voice -type f -name 'scene-*.mp3' -exec cp {} public/voice/ \;
          test -s reused-voice/out/props.json
          find public/voice -name 'scene-*.mp3' | sort
      - name: Install offline whisper.cpp only when caption alignment is enabled
        if: env.KCI_ALIGN_CAPTIONS == '1'
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ 
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git "$RUNNER_TEMP/whisper.cpp"
          cmake -S "$RUNNER_TEMP/whisper.cpp" -B "$RUNNER_TEMP/whisper.cpp/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/whisper.cpp/build" -j 2 --target whisper-cli
          install_dir="$RUNNER_TEMP/whisper.cpp/build/bin"
          if [ ! -x "$install_dir/whisper-cli" ]; then
            install_dir="$RUNNER_TEMP/whisper.cpp/build"
          fi
          sudo install -m 755 "$install_dir/whisper-cli" /usr/local/bin/whisper-cli
          mkdir -p "$HOME/.cache/kci-whisper"
          if [ ! -s "$HOME/.cache/kci-whisper/ggml-small.bin" ]; then
            curl -L --fail --retry 3 -o "$HOME/.cache/kci-whisper/ggml-small.bin" \
              "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin"
          fi
          echo "KCI_WHISPER_BIN=whisper-cli" >> "$GITHUB_ENV"
          echo "KCI_WHISPER_MODEL=$HOME/.cache/kci-whisper/ggml-small.bin" >> "$GITHUB_ENV"
          echo "Upstream whisper.cpp table lists ggml-small at about 466 MiB. If this step fails, run-job keeps the 7-word cues and the render continues."
      - name: Produce preview, Vbee test, or MP4
        run: node scripts/run-job.mjs
      - name: Preserve audio and review artifacts even if a later render step fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kci-${{ github.run_id }}
          path: |
            out/
            public/voice/*.mp3
          if-no-files-found: warn
          retention-days: 7

      - name: Record Actions run on the requesting issue
        if: ${{ always() && github.event_name == 'issues' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KCI_ISSUE: ${{ github.event.issue.number }}
          KCI_REPO: ${{ github.repository }}
          KCI_RUN_ID: ${{ github.run_id }}
          KCI_RESULT: ${{ job.status }}
        run: |
          gh issue comment "$KCI_ISSUE" --repo "$KCI_REPO" \
            --body "KCI_ACTIONS_RUN:$KCI_RUN_ID | Result: $KCI_RESULT | https://github.com/$KCI_REPO/actions/runs/$KCI_RUN_ID — Review-only artifact; do not auto-publish."
