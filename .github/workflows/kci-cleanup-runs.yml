name: KCI Cleanup — delete runs older than 2 days

# Owner request 17/11/2026: render history is not needed after review, so every
# day this deletes ALL completed workflow runs older than 2 days (success and
# failure), including their logs and artifacts (rendered MP4/MP3). Deletion is
# permanent. Issues, commits, jobs/ and editorial/ files are NOT touched.
# Runs still queued or in progress are never deleted.

on:
  schedule:
    - cron: '17 19 * * *'   # 04:17 KST daily
  workflow_dispatch:
    inputs:
      days:
        description: 'Delete completed runs older than this many days'
        required: false
        default: '2'

permissions:
  actions: write
  contents: read

concurrency:
  group: kci-cleanup-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete completed runs older than the cutoff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.days || '2' }}
          SELF_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$DAYS" =~ ^[0-9]+$ ]] && (( DAYS >= 1 )) || { echo "::error::days must be a whole number >= 1"; exit 1; }
          cutoff="$(date -u -d "-${DAYS} days" +%Y-%m-%dT%H:%M:%SZ)"
          echo "Deleting completed runs created before $cutoff"
          gh api --paginate "repos/$REPO/actions/runs?per_page=100&created=%3C$cutoff" \
            --jq '.workflow_runs[] | select(.status=="completed") | .id' > runs.txt
          deleted=0; failed=0
          while read -r id; do
            [[ -z "$id" || "$id" == "$SELF_RUN" ]] && continue
            if gh api -X DELETE "repos/$REPO/actions/runs/$id" --silent; then
              deleted=$((deleted+1))
            else
              failed=$((failed+1))
            fi
          done < runs.txt
          echo "Deleted $deleted runs (failed $failed) older than $DAYS days." | tee -a "$GITHUB_STEP_SUMMARY"
