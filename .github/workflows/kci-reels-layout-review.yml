name: KCI Reels Layout Review
on:
  issues:
    types: [opened]
permissions:
  contents: read
  actions: read
jobs:
  review:
    if: github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[KCI REELS LAYOUT REVIEW]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore previously approved Vietnamese Vbee audio, no TTS calls
        uses: actions/download-artifact@v4
        with:
          name: kci-40059664340
          run-id: 40059664340
          github-token: ${{ github.token }}
          path: .
      - name: Validate archived audio and CTA
        run: |
          test -s out/props.json
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("out/props.json","utf8")); if(p.scenes.length!==7 || !p.scenes.at(-1).cta || !p.scenes.every(s=>s.audioFile))throw Error("Missing original narrated job or CTA"); for(let i=1;i<=7;i++){const f="public/voice/scene-"+String(i).padStart(2,"0")+".mp3";if(!fs.existsSync(f)||fs.statSync(f).size<10000)throw Error("Missing original Vbee MP3: "+f);} console.log("Original seven Vbee narrations verified; no new synthesis");'
      - name: Render current approved full-width Reels-safe daily composition
        run: npx remotion render src/index.ts KciNewsDaily out/KCI_2026-10-23_Reels_FullWidth_Review.mp4 --props=out/props.json --codec=h264 --concurrency=3
      - name: Create scene review stills
        run: |
          mkdir -p out/stills
          for frame in 85 390 660 980 1300 1580 2100; do
            npx remotion still src/index.ts KciNewsDaily out/stills/at-$frame.png --props=out/props.json --frame=$frame
          done
      - name: Upload review MP4 and stills; never post automatically
        uses: actions/upload-artifact@v4
        with:
          name: kci-reels-fullwidth-${{ github.run_id }}
          path: |
            out/KCI_2026-10-23_Reels_FullWidth_Review.mp4
            out/stills/
          if-no-files-found: error
          retention-days: 7
